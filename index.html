<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>8th Youth Revival Meet - Check-In</title>

  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07152f;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    .scanner-box {
      background: #10244a;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    video {
      width: 100%;
      border-radius: 14px;
      background: black;
      display: block;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #d9ad45;
      color: #07152f;
    }

    button:disabled {
      opacity: 0.5;
    }

    .status {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #10244a;
      min-height: 60px;
      font-size: 16px;
    }

    .success {
      background: #14532d;
    }

    .warning {
      background: #713f12;
    }

    .error {
      background: #7f1d1d;
    }

    .participant-name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .church {
      font-size: 14px;
      opacity: 0.9;
    }

    .time {
      margin-top: 8px;
      font-size: 14px;
    }

    .footer {
      margin-top: 18px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="title">
    8th Youth Revival Meet 2026
  </div>

  <div class="subtitle">
    Attendance Check-In
  </div>

  <div class="scanner-box">

    <video id="video" playsinline></video>

    <button id="startButton" onclick="startScanner()">
      START SCANNER
    </button>

    <div id="status" class="status">
      Press START SCANNER to begin.
    </div>

  </div>

  <div class="footer">
    Scan the barcode printed on the participant ID card.
  </div>

</div>

<script>

  let codeReader = null;
  let scanning = false;
  let processingScan = false;
  let lastScannedCode = "";
  let lastScanTime = 0;

  async function startScanner() {

    if (scanning) {
      return;
    }

    const video =
      document.getElementById("video");

    const button =
      document.getElementById("startButton");

    const status =
      document.getElementById("status");

    status.className = "status";
    status.innerHTML = "Starting camera...";

    button.disabled = true;
    button.innerHTML = "SCANNING...";

    try {

      // Check camera support
      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {

        throw new Error(
          "Camera access is not supported by this browser."
        );
      }

      codeReader =
        new ZXingBrowser.BrowserMultiFormatReader();

      scanning = true;

      await codeReader.decodeFromConstraints(
        {
          video: {
            facingMode: {
              ideal: "environment"
            }
          }
        },
        video,
        (result, error) => {

          if (result) {

            const code =
              result.getText().trim();

            const now =
              Date.now();

            if (
              code === lastScannedCode &&
              now - lastScanTime < 3000
            ) {
              return;
            }

            if (processingScan) {
              return;
            }
            
            lastScannedCode = code;
            lastScanTime = now;
            processingScan = true;
            
            processScan(code);
          }

        }
      );

      status.className = "status";
      status.innerHTML = "Camera ready. Scan the barcode.";

    } catch (error) {

      scanning = false;
      button.disabled = false;

      status.className = "status error";

      status.innerHTML =
        "Unable to start camera.<br><br>" +
        escapeHtml(
          error.message ||
          "Camera permission was denied."
        );
    }
  }
  function stopScanner() {

  if (codeReader) {
    try {
      codeReader.reset();
    } catch (error) {
      console.log(error);
    }
  }

  scanning = false;

  const button =
    document.getElementById("startButton");

  button.disabled = false;
  button.innerHTML = "START NEW SCAN";
}


  function processScan(registrationId) {

  const status =
    document.getElementById("status");

  status.className = "status";
  status.innerHTML =
    "Checking registration...";

  const callbackName =
    "scanCallback_" + Date.now();

  const script =
    document.createElement("script");

  const url =
    "https://script.google.com/macros/s/AKfycbzPce2OYEelkDPBQQ2iG1SBy3mDrybicpqmruhPUC6xZDULueAFAYX_YMxDbthkcpJb/exec" +
    "?action=scan" +
    "&registrationId=" +
    encodeURIComponent(registrationId) +
    "&callback=" +
    callbackName;


  window[callbackName] = function(result) {

    try {

      showResult(result);

    } catch (error) {

      showError(error);

    } finally {

      delete window[callbackName];
    
      script.remove();
    
      processingScan = false;
    
    }
  };


  script.src = url;

  script.onerror = function() {

  delete window[callbackName];

  script.remove();

  processingScan = false;

  showError({
    message:
      "Unable to connect to attendance server."
  });

};


  document.body.appendChild(script);
}

  function showResult(result) {
    stopScanner();

  const status =
    document.getElementById("status");


  if (!result) {

    status.className =
      "status error";

    status.innerHTML =
      "No response from server.";

    return;
  }


  // ==========================================
  // CHECK-IN SUCCESSFUL
  // ==========================================

  if (result.success) {

    status.className =
      "status success";

    status.innerHTML =

      "<div class='participant-name'>" +
      escapeHtml(result.name) +
      "</div>" +

      "<div class='church'>" +
      escapeHtml(result.church) +
      "</div>" +

      "<div class='time'>" +
      "CHECK-IN SUCCESSFUL<br>" +
      escapeHtml(result.time) +
      "</div>";

    return;
  }


  // ==========================================
  // ALREADY CHECKED IN
  // ==========================================

  if (
    result.status === "ALREADY_ACTIVE"
  ) {

    status.className =
      "status warning";

    status.innerHTML =

      "<div class='participant-name'>" +
      "ALREADY ACTIVE" +
      "</div>" +

      "<div class='church'>" +
      escapeHtml(result.name) +
      "</div>" +

      "<div class='time'>" +
      "Original Check-In:<br>" +
      escapeHtml(result.time) +
      "</div>";

    return;
  }


  // ==========================================
  // OTHER ERROR
  // ==========================================

  status.className =
    "status error";

  status.innerHTML =
    escapeHtml(
      result.message ||
      "Unable to process barcode."
    );
}

  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

</script>

</body>
</html>
